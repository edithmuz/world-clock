<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.37/moment-timezone-with-data-1970-2030.min.js"></script>
    <link rel="stylesheet" href="css/style.css" />

    <title>World Clock - Edith Muzah</title>
  </head>
  <body>
    <div class="container">
      <div class="h1">
        <h1>World Clock</h1>
      </div>

      <select id="city">
        <option value="">Select a city...</option>
        <option value="current">My current location</option>
        <option value="Europe/Paris">Paris</option>
        <option value="America/New_York">New York</option>
        <option value="Australia/Sydney">Sydney</option>
        <option value="Asia/Tokyo">Tokyo</option>
        <option value="Africa/Gaborone">Gaborone</option>
        <option value="Asia/Bangkok">Bangkok</option>
        <option value="Europe/Lisbon">Lisbon</option>
        <option value="Asia/Dubai">Dubai</option>
      </select>

      <div id="cities">
        <div class="city" id="auckland">
          <div>
            <h2>Auckland 🇦🇺</h2>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>

        <div class="city" id="johannesburg">
          <div>
            <h2>Johannesburg 🇿🇦</h2>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>

        <div class="city" id="london">
          <div>
            <h2>London 🇬🇧</h2>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>

        <div class="city" id="chicago">
          <div>
            <h2>Chicago 🇺🇸</h2>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>
      </div>
    </div>

    <footer>
      This project was coded by
      <a href="https://github.com/edithmuz/" target="_blank"> Edith Muzah</a>
      and is open-sourced on
      <a href="https://github.com/edithmuz/world-clock" target="_blank">
        open-sourced on Github</a
      >
      and hosted on <a href="https://worldclock-proj.netlify.app/">Netlify</a>
    </footer>

    <script src="javascript/index.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/style.css" />

    <title>World Clock - Edith Muzah</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>

      <select>
        <option value="">Select a city...</option>
        <option value="">Johannesburg</option>
        <option value="">New York</option>
        <option value="">Sydney</option>
      </select>

      <div class="city">
        <div>
          <h2>Auckland 🇦🇺</h2>
          <div class="date">August 15th 2025</div>
        </div>
        <div class="time">1:48:15 <small>AM</small></div>
      </div>

      <div class="city">
        <div>
          <h2>Cape Town 🇿🇦</h2>
          <div class="date">August 15th 2025</div>
        </div>
        <div class="time">1:48:15 <small>AM</small></div>
      </div>
    </div>

    <footer>
      This project was coded by
      <a href="https://github.com/edithmuz/" target="_blank"> Edith Muzah</a>
      and is open-sourced on
      <a href="https://github.com/edithmuz/world-clock" target="_blank">
        open-sourced on Github</a
      >
      and hosted on <a href="https://worldclock-proj.netlify.app/">Netlify</a>
    </footer>

    <script src="javascript/index.js"></script>
  </body>
</html>
